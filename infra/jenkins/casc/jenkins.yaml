# ---------------------------------------------------------------------------
# cicd-ai-flow - Jenkins Configuration as Code
#
# Variables:
#   ${VAR:-default}  -> container environment (docker-compose "environment",
#                       fed from infra/.env) or a file $SECRETS/<VAR>
#                       (/run/casc-secrets, bind-mounted from infra/secrets/)
#   agent_ssh_key    -> infra/secrets/agent_ssh_key  (generated by up.sh)
#   SONAR_TOKEN      -> infra/secrets/SONAR_TOKEN    (written by bootstrap-sonar.sh)
#
# Everything here must survive empty GITHUB_*/GEMINI_API_KEY/SONAR_TOKEN values.
# ---------------------------------------------------------------------------
jenkins:
  systemMessage: "cicd-ai-flow Jenkins - managed by JCasC (infra/jenkins/casc/jenkins.yaml). Builds run on the static agent 'cicd-agent'."
  # the controller itself never runs builds
  numExecutors: 0
  mode: EXCLUSIVE
  quietPeriod: 0
  scmCheckoutRetryCount: 2
  # inbound (JNLP) agents are not used, but keep the TCP port as agreed.
  # JNLP4-connect is the only agent protocol in current cores; the JCasC
  # attribute "agentProtocols" is deprecated and rejected at boot, so it is not set.
  slaveAgentPort: 50000

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Administrator"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  crumbIssuer: "standard"

  nodes:
    - permanent:
        name: "cicd-agent"
        nodeDescription: "Static build agent: JDK 21, Node 22, git, docker CLI (host socket), sonar-scanner, trivy, python3"
        labelString: "cicd-agent"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 2
        mode: NORMAL
        retentionStrategy: "always"
        launcher:
          ssh:
            host: "jenkins-agent"
            port: 22
            credentialsId: "agent-ssh-key"
            javaPath: "/opt/java/openjdk/bin/java"
            launchTimeoutSeconds: 60
            maxNumRetries: 30
            retryWaitTime: 10
            sshHostKeyVerificationStrategy:
              nonVerifyingKeyVerificationStrategy: {}

security:
  globalJobDslSecurityConfiguration:
    # Job DSL scripts below are trusted (they come from this file), so do not
    # require manual script approval.
    useScriptSecurity: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-token"
              description: "GitHub account + personal access token (repo, workflow). Set GITHUB_USERNAME/GITHUB_TOKEN in infra/.env"
              username: "${GITHUB_USERNAME:-changeme}"
              password: "${GITHUB_TOKEN:-changeme}"
          - string:
              scope: GLOBAL
              id: "gemini-api-key"
              description: "Google Gemini API key. Set GEMINI_API_KEY in infra/.env"
              secret: "${GEMINI_API_KEY:-}"
          - string:
              scope: GLOBAL
              id: "sonar-token"
              description: "SonarQube global analysis token (generated by infra/scripts/bootstrap-sonar.sh)"
              secret: "${SONAR_TOKEN:-}"
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: "agent-ssh-key"
              username: "jenkins"
              description: "SSH key used by the controller to launch the cicd-agent node (infra/secrets/agent_ssh_key)"
              privateKeySource:
                directEntry:
                  privateKey: "${agent_ssh_key:-}"

unclassified:
  location:
    url: "http://localhost:8080/"
    adminAddress: "admin@localhost"

  # SonarQube Scanner for Jenkins: withSonarQubeEnv('SonarQube')
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"
        triggers:
          skipScmCause: false
          skipUpstreamCause: false

  timestamper:
    allPipelines: true

# ---------------------------------------------------------------------------
# Job DSL: 3 multibranch pipelines
#   cicd-ai-flow-cicd        GitHub, branch "main" only, Jenkinsfile
#   cicd-ai-flow-codereview  GitHub, pull requests only, ci/Jenkinsfile.codereview
#   cicd-ai-flow-local       local bare repo (no GitHub needed), Jenkinsfile
# NOTE: no "${...}" inside the Groovy below - JCasC would try to expand it.
# ---------------------------------------------------------------------------
jobs:
  - script: |
      String owner = (System.getenv('GITHUB_OWNER') ?: '').trim()
      String repo  = (System.getenv('GITHUB_REPO')  ?: '').trim()
      if (!repo) { repo = 'cicd-ai-flow' }
      boolean githubConfigured = owner && owner != 'changeme'
      String effOwner = githubConfigured ? owner : 'changeme'
      String note = githubConfigured ? '' :
          '\n\n[NOT CONFIGURED] GITHUB_OWNER is empty: set GITHUB_OWNER, GITHUB_REPO, GITHUB_USERNAME, GITHUB_TOKEN in infra/.env ' +
          'and re-run infra/scripts/up.sh. The periodic scan is disabled until then.'

      // ---------------- CI/CD (main) ----------------
      multibranchPipelineJob('cicd-ai-flow-cicd') {
        displayName('cicd-ai-flow-cicd')
        description('CI/CD pipeline for branch "main" of ' + effOwner + '/' + repo + ' (script path: Jenkinsfile).' + note)
        branchSources {
          branchSource {
            source {
              github {
                id('cicd-ai-flow-cicd-github')
                repoOwner(effOwner)
                repository(repo)
                repositoryUrl('https://github.com/' + effOwner + '/' + repo)
                configuredByUrl(false)
                credentialsId('github-token')
                traits {
                  // 3 = discover all branches (no PR discovery here)
                  gitHubBranchDiscovery { strategyId(3) }
                  headRegexFilter { regex('main') }
                }
              }
            }
          }
        }
        factory {
          workflowBranchProjectFactory { scriptPath('Jenkinsfile') }
        }
        orphanedItemStrategy {
          discardOldItems { daysToKeep(0); numToKeep(0) }
        }
        if (githubConfigured) {
          triggers { periodicFolderTrigger { interval('1m') } }
        }
      }

      // ---------------- Code review (pull requests) ----------------
      multibranchPipelineJob('cicd-ai-flow-codereview') {
        displayName('cicd-ai-flow-codereview')
        description('AI code review pipeline for pull requests of ' + effOwner + '/' + repo + ' (script path: ci/Jenkinsfile.codereview).' + note)
        branchSources {
          branchSource {
            source {
              github {
                id('cicd-ai-flow-codereview-github')
                repoOwner(effOwner)
                repository(repo)
                repositoryUrl('https://github.com/' + effOwner + '/' + repo)
                configuredByUrl(false)
                credentialsId('github-token')
                traits {
                  // origin PRs: 1 = merge PR with the current target branch revision
                  gitHubPullRequestDiscovery { strategyId(1) }
                  // fork PRs: same strategy, trust users with write permission
                  gitHubForkDiscovery {
                    strategyId(1)
                    trust { gitHubTrustPermissions() }
                  }
                }
              }
            }
          }
        }
        factory {
          workflowBranchProjectFactory { scriptPath('ci/Jenkinsfile.codereview') }
        }
        orphanedItemStrategy {
          discardOldItems { daysToKeep(0); numToKeep(0) }
        }
        if (githubConfigured) {
          triggers { periodicFolderTrigger { interval('1m') } }
        }
      }

      // ---------------- Local verification (no GitHub) ----------------
      multibranchPipelineJob('cicd-ai-flow-local') {
        displayName('cicd-ai-flow-local')
        description('Local verification job. Git branch source: file:///var/jenkins_home/repos/cicd-ai-flow.git ' +
                    '(shared volume, push with infra/scripts/push-local.sh). Script path: Jenkinsfile.')
        branchSources {
          branchSource {
            source {
              git {
                id('cicd-ai-flow-local-git')
                remote('file:///var/jenkins_home/repos/cicd-ai-flow.git')
                traits {
                  gitBranchDiscovery()
                }
              }
            }
          }
        }
        factory {
          workflowBranchProjectFactory { scriptPath('Jenkinsfile') }
        }
        orphanedItemStrategy {
          discardOldItems { daysToKeep(0); numToKeep(0) }
        }
        triggers { periodicFolderTrigger { interval('1m') } }
      }

      // ---------------- Local PR-review simulation (no GitHub) ----------------
      // Runs ci/Jenkinsfile.codereview against a branch of the local bare repo and
      // injects the multibranch PR variables (CHANGE_*) as build parameters.
      // NOTE: the Jenkinsfile's own "parameters {}" block is MERGED into this job's
      // parameter definitions on the first run (verified with pipeline-model-definition
      // 2.2293: both sets stay defined), so buildWithParameters keeps working for
      // CHANGE_* afterwards. A JCasC reload restores the definitions from this file.
      pipelineJob('cicd-ai-flow-local-codereview') {
        displayName('cicd-ai-flow-local-codereview')
        description('Local simulation of the PR code-review pipeline (ci/Jenkinsfile.codereview) without GitHub: ' +
                    'checks out REVIEW_BRANCH from file:///var/jenkins_home/repos/cicd-ai-flow.git and injects CHANGE_* ' +
                    'as parameters. Use REVIEW_DRY_RUN=true and GEMINI_FAKE=1 to avoid GitHub/Gemini calls. ' +
                    'Create the demo branch with: bash infra/scripts/push-local.sh (main) then app/vuln-samples/apply.sh on a branch (see infra/README.md).')
        parameters {
          stringParam('REVIEW_BRANCH', 'demo/vulnerable-code', 'Branch of the local bare repo to review (simulated PR head)')
          stringParam('CHANGE_ID', '1', 'Simulated pull request number (non-empty => Jenkinsfile treats the build as a PR)')
          stringParam('CHANGE_TARGET', 'main', 'Simulated PR target branch (must exist in the bare repo; used for merge-base)')
          stringParam('CHANGE_BRANCH', 'demo/vulnerable-code', 'Simulated PR source branch name (display only)')
          stringParam('CHANGE_URL', 'https://github.com/changeme/cicd-ai-flow/pull/1', 'Simulated PR URL (owner/repo is parsed from it)')
          stringParam('CHANGE_AUTHOR', 'demo', 'Simulated PR author')
          stringParam('CHANGE_TITLE', 'demo: vulnerable samples', 'Simulated PR title')
          stringParam('GEMINI_FAKE', '1', '1 = ci/scripts/gemini_review.py uses its deterministic fake backend (no Gemini API call)')
          booleanParam('REVIEW_DRY_RUN', true, 'true = do not post to GitHub, write review-dryrun.md instead (also declared by the Jenkinsfile; defined here so the first run honours it)')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('file:///var/jenkins_home/repos/cicd-ai-flow.git') }
                // written as a concatenation so JCasC does not try to expand it
                branch('*/$' + '{REVIEW_BRANCH}')
              }
            }
            scriptPath('ci/Jenkinsfile.codereview')
            lightweight(true)
          }
        }
      }
