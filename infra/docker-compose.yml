# ---------------------------------------------------------------------------
# cicd-ai-flow local CI/CD stack (run from WSL: bash infra/scripts/up.sh)
#
#   jenkins        http://localhost:8080  (controller, JCasC, 0 executors)
#   jenkins-agent  static SSH agent, label "cicd-agent", Docker-out-of-Docker
#   sonarqube      http://localhost:9000  (Community Build)
#   sonar-db       PostgreSQL 16
#
# Values come from infra/.env (copied from .env.example by up.sh).
# ---------------------------------------------------------------------------
name: cicd-ai-flow

services:
  jenkins:
    build:
      context: ./jenkins
    image: cicd-ai-flow/jenkins:local
    container_name: cicd-jenkins
    hostname: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      CASC_JENKINS_CONFIG: /usr/local/etc/casc/jenkins.yaml
      # JCasC also resolves ${VAR} from files in this directory (infra/secrets/)
      SECRETS: /run/casc-secrets
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      GITHUB_OWNER: ${GITHUB_OWNER:-}
      GITHUB_REPO: ${GITHUB_REPO:-cicd-ai-flow}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # NOTE: SONAR_TOKEN is intentionally NOT passed as an env var. JCasC reads
      # it from /run/casc-secrets/SONAR_TOKEN so bootstrap-sonar.sh can update
      # it with a JCasC reload instead of recreating the container.
    volumes:
      - jenkins_home:/var/jenkins_home
      - jenkins_repos:/var/jenkins_home/repos
      - ./secrets:/run/casc-secrets:ro
    networks:
      - cicd-net
    depends_on:
      jenkins-agent:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/login || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s

  jenkins-agent:
    build:
      context: ./agent
      args:
        DOCKER_GID: ${DOCKER_GID:-1001}
    image: cicd-ai-flow/jenkins-agent:local
    container_name: cicd-jenkins-agent
    hostname: jenkins-agent
    restart: unless-stopped
    environment:
      # public key is read from this file by agent/entrypoint.sh
      JENKINS_AGENT_SSH_PUBKEY_FILE: /run/casc-secrets/agent_ssh_key.pub
    volumes:
      - ./secrets/agent_ssh_key.pub:/run/casc-secrets/agent_ssh_key.pub:ro
      # Docker-out-of-Docker: builds use the host daemon (deploy stage, image builds)
      - /var/run/docker.sock:/var/run/docker.sock
      # local bare repo shared with the controller (job cicd-ai-flow-local)
      - jenkins_repos:/var/jenkins_home/repos
      # build caches
      - agent_workspace:/home/jenkins/agent
      - agent_gradle:/home/jenkins/.gradle
      - agent_npm:/home/jenkins/.npm
      - agent_cache:/home/jenkins/.cache
      - agent_sonar:/home/jenkins/.sonar
    extra_hosts:
      # reach containers published on the host (e.g. deployed app on 8081/3000)
      - "host.docker.internal:host-gateway"
    networks:
      - cicd-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  sonarqube:
    image: sonarqube:community
    container_name: cicd-sonarqube
    hostname: sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # host already has vm.max_map_count=1048576; this just makes a dev box forgiving
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    # Allow the webhook to http://jenkins:8080/ (a private/site-local address, rejected by
    # default). The entrypoint prepends "java -jar lib/sonarqube.jar" when args start with "-".
    command: ["-Dsonar.validateWebhooks=false"]
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    stop_grace_period: 60s
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    networks:
      - cicd-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q '\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s

  sonar-db:
    image: postgres:16-alpine
    container_name: cicd-sonar-db
    hostname: sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    networks:
      - cicd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  jenkins_home:
  jenkins_repos:
  agent_workspace:
  agent_gradle:
  agent_npm:
  agent_cache:
  agent_sonar:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_db:

networks:
  cicd-net:
    name: cicd-net
