# SonarQube analysis configuration for the cicd-ai-flow monorepo.
# Analyses backend (Kotlin) and frontend (TypeScript) in one project.
# sonar.host.url / sonar.token are NOT set here: Jenkins injects them via withSonarQubeEnv.

sonar.projectKey=cicd-ai-flow
sonar.projectName=cicd-ai-flow
sonar.sourceEncoding=UTF-8

# Main sources
sonar.sources=app/backend/src/main,app/frontend/src
# Test sources (frontend tests live next to the code, so they are selected by sonar.test.inclusions)
sonar.tests=app/backend/src/test,app/frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*Test.kt,**/*Tests.kt

# Anything that is generated, vendored, or intentionally vulnerable demo code is excluded from main sources.
# Test files are also excluded from main sources so that main/test sets are disjoint.
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,app/vuln-samples/**,**/*.test.ts,**/*.test.tsx,app/frontend/src/test/**,**/*.d.ts
# Nothing besides unit tests/specs should be counted as coverage targets
sonar.coverage.exclusions=app/frontend/src/main.tsx,**/TodoApplication.kt,**/vuln/**

# Backend (Kotlin)
sonar.java.binaries=app/backend/build/classes/kotlin/main
sonar.kotlin.file.suffixes=.kt,.kts
sonar.coverage.jacoco.xmlReportPaths=app/backend/build/reports/jacoco/test/jacocoTestReport.xml
sonar.junit.reportPaths=app/backend/build/test-results/test

# Frontend (TypeScript)
sonar.javascript.lcov.reportPaths=app/frontend/coverage/lcov.info
sonar.typescript.tsconfigPaths=app/frontend/tsconfig.app.json
