server {
    # nginx runs unprivileged (uid 101), so it listens on 8080; compose maps host 3000 -> 8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend through Docker's embedded DNS at request time, so nginx starts
    # even if the backend container is (re)created later.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8081;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # API proxy: /api/... -> http://backend:8081/api/...
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Expose only the backend health probe (handy for smoke tests).
    location = /actuator/health {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
