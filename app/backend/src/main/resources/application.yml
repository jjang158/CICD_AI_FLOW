server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: cicd-ai-flow-backend
  datasource:
    url: jdbc:h2:mem:todos;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false

app:
  sample-data:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

logging:
  level:
    root: INFO
    com.cicdaiflow: INFO
